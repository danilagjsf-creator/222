<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stack</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f4a; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(20, 16, 48, .72); color: #fff; font-family: -apple-system, "SF Pro Display", Roboto, sans-serif; text-align: center; padding: 24px; }
  #ui.hidden { display: none; }
  #title { font-size: clamp(34px, 11vw, 64px); font-weight: 800; line-height: 1.05; margin: 0; }
  #sub { font-size: clamp(16px, 4.5vw, 22px); opacity: .7; margin: 0; }
  #ui { gap: 12px; }
  .hidden { display: none !important; }
  .btn { border: 0; border-radius: 999px; padding: 14px 40px; font-size: 19px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #ff5fa2, #c13cd9); box-shadow: 0 8px 24px rgba(193,60,217,.45); cursor: pointer; font-family: inherit; min-width: 250px; }
  .btn:active { transform: scale(.97); }
  .btn.alt { background: rgba(255,255,255,.14); box-shadow: none; }
  .btn.gold { background: linear-gradient(135deg, #ffd34d, #ff9d2e); color: #4a2410; box-shadow: 0 8px 24px rgba(255,170,50,.45); }
  .btn:disabled { opacity: .4; box-shadow: none; cursor: default; }
  #chest { width: min(48vw, 210px); overflow: visible; }
  #chest.ready { animation: pulse 1.2s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255,210,80,.8)); }
  #chest.shake { animation: shake .9s ease-in-out; }
  #chest #lid { transition: transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin: 20px 70px; }
  #chest.open #lid { transform: translate(0,-30px) rotate(-16deg); }
  #chest #glow { opacity: 0; transition: opacity .5s; }
  #chest.open #glow { opacity: 1; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes shake { 10%,50%,90% { transform: translateX(-6px) rotate(-3deg); } 30%,70% { transform: translateX(6px) rotate(3deg); } }
  #barWrap { position: relative; width: min(78vw, 360px); }
  #bar { height: 26px; border-radius: 13px; background: rgba(255,255,255,.14); overflow: hidden; }
  #fill { height: 100%; width: 0; border-radius: 13px; background: linear-gradient(90deg, #ff5fa2, #c13cd9, #6c5ce7); }
  #xpText { margin-top: 6px; font-size: 15px; opacity: .85; }
  #gain { position: absolute; right: 0; top: -26px; font-weight: 800; color: #ffd34d; opacity: 0; font-size: 18px; }
  #gain.show { animation: gain 1.6s ease-out; }
  @keyframes gain { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  #counts { display: flex; gap: 22px; font-size: 17px; font-weight: 600; }
  #counts b { color: #ffd34d; }
  #prize { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(15,10,40,.92); color: #fff; font-family: -apple-system,"SF Pro Display",Roboto,sans-serif; text-align: center; z-index: 5; }
  #prize small { opacity: .7; font-size: 18px; }
  #prizeName { font-size: clamp(44px, 14vw, 80px); font-weight: 800; background: linear-gradient(135deg,#ffd34d,#ff5fa2); -webkit-background-clip: text; background-clip: text; color: transparent; animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1 id="title"></h1>
  <p id="sub"></p>
  <svg id="chest" viewBox="0 0 200 160">
    <defs><radialGradient id="g"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb52e" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="100" cy="148" rx="80" ry="8" fill="rgba(0,0,0,.3)"/>
    <rect x="20" y="70" width="160" height="72" rx="8" fill="#8a4b1f" stroke="#4a2410" stroke-width="4"/>
    <path d="M24 95H176M24 118H176" stroke="#6b3716" stroke-width="3"/>
    <rect x="42" y="70" width="14" height="72" fill="#f2b632"/>
    <rect x="144" y="70" width="14" height="72" fill="#f2b632"/>
    <ellipse id="glow" cx="100" cy="62" rx="80" ry="40" fill="url(#g)"/>
    <g id="lid">
      <path d="M20 70Q20 22 100 22Q180 22 180 70Z" fill="#a85a26" stroke="#4a2410" stroke-width="4"/>
      <rect x="42" y="38" width="14" height="32" fill="#f2b632"/>
      <rect x="144" y="38" width="14" height="32" fill="#f2b632"/>
    </g>
    <rect x="88" y="62" width="24" height="26" rx="5" fill="#ffd34d" stroke="#4a2410" stroke-width="3"/>
    <circle cx="100" cy="73" r="3.5" fill="#4a2410"/><rect x="98.5" y="73" width="3" height="9" fill="#4a2410"/>
  </svg>
  <div id="barWrap"><span id="gain"></span><div id="bar"><div id="fill"></div></div><div id="xpText"></div></div>
  <div id="counts"><div>Минет: <b id="cntM">0</b></div><div>Отлиз: <b id="cntO">0</b></div></div>
  <button class="btn" id="btnPlay">Играть</button>
  <button class="btn gold" id="btnOpen">Открыть ящик</button>
  <button class="btn alt hidden" id="btnMenu">В главное меню</button>
</div>
<div id="prize" class="hidden">
  <small>Тебе выпало</small>
  <div id="prizeName"></div>
  <button class="btn" id="btnPrizeOk">Забрать</button>
</div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); } catch (e) {} }

  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W, H, dpr, K;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    K = Math.min(W / 600, H / 900);
  }
  window.addEventListener('resize', resize); resize();

  // ---- настройки ----
  var BLOCK_H = 24, START = 200, AMP = 240, SNAP = 5;
  var best = 0;
  try { best = parseInt(localStorage.getItem('stack_best') || '0', 10) || 0; } catch (e) {}
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem('best', function (err, v) {
      var n = parseInt(v || '0', 10) || 0;
      if (!err && n > best) best = n;
    });
  }
  function saveBest() {
    try { localStorage.setItem('stack_best', String(best)); } catch (e) {}
    if (tg && tg.CloudStorage) tg.CloudStorage.setItem('best', String(best));
  }
  function haptic(t) { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} }

  // ---- состояние ----
  var stack, cur, debris, score, over, overAt, cam, last;
  var state = 'menu';                       // start | play | over
  // ---- XP и ящик ----
  var XP_NEED = 150, xp = 0, xpBefore = 0, openedFrom = 0, anim = 0;
  try { xp = parseInt(localStorage.getItem('stack_xp') || '0', 10) || 0; } catch (e) {}
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem('xp', function (err, v) {
      if (!err && v) { xp = parseInt(v, 10) || 0; if (state === 'menu') { setBar(xp); refreshChest(xp); } }
    });
  }
  var prizes = { m: 0, o: 0 };
  try { var pj = JSON.parse(localStorage.getItem('stack_prizes') || 'null'); if (pj) prizes = pj; } catch (e) {}
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem('prizes', function (err, v) {
      try { if (!err && v) { prizes = JSON.parse(v); renderCounts(); } } catch (e) {}
    });
  }
  function savePrizes() {
    var j = JSON.stringify(prizes);
    try { localStorage.setItem('stack_prizes', j); } catch (e) {}
    if (tg && tg.CloudStorage) tg.CloudStorage.setItem('prizes', j);
  }
  function renderCounts() {
    document.getElementById('cntM').textContent = prizes.m;
    document.getElementById('cntO').textContent = prizes.o;
  }
  function saveXP() {
    try { localStorage.setItem('stack_xp', String(xp)); } catch (e) {}
    if (tg && tg.CloudStorage) tg.CloudStorage.setItem('xp', String(xp));
  }

  var $ = function (id) { return document.getElementById(id); };
  var ui = $('ui'), uiTitle = $('title'), uiSub = $('sub'), chest = $('chest'),
      fill = $('fill'), xpText = $('xpText'), gain = $('gain'),
      btnPlay = $('btnPlay'), btnOpen = $('btnOpen'), btnMenu = $('btnMenu'),
      prize = $('prize'), prizeName = $('prizeName');

  function setBar(v) {
    var c = Math.min(Math.round(v), XP_NEED);
    fill.style.width = (c / XP_NEED * 100) + '%';
    xpText.textContent = c + ' / ' + XP_NEED + ' XP';
  }
  function refreshChest(v) {
    var ready = v >= XP_NEED;
    chest.classList.toggle('ready', ready);
    btnOpen.disabled = !ready;
    btnOpen.textContent = ready ? 'Открыть ящик' : 'Нужно ' + XP_NEED + ' XP';
  }
  function animateXP(from, to, dur, cb) {       // плавное наполнение полоски
    cancelAnimationFrame(anim);
    var t0 = performance.now();
    (function step(t) {
      var p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      setBar(from + (to - from) * e);
      if (p < 1) anim = requestAnimationFrame(step); else { setBar(to); if (cb) cb(); }
    })(t0);
  }
  function showMenu(mode, shownXP) {
    var over = mode === 'over';
    uiTitle.textContent = over ? 'С тебя минет' : 'Люблю Настю';
    uiSub.textContent = over ? 'Счёт: ' + score + '  ·  Рекорд: ' + best : 'Копи XP и открывай ящик';
    btnPlay.textContent = over ? 'Начать заново' : 'Играть';
    btnMenu.classList.toggle('hidden', !over);
    chest.classList.remove('open', 'shake');
    setBar(shownXP); refreshChest(shownXP); renderCounts();
    ui.classList.remove('hidden');
  }
  function showOver() {
    setTimeout(function () {
      if (state !== 'over') return;
      showMenu('over', xpBefore);
      if (score > 0) {
        gain.textContent = '+' + score + ' XP';
        gain.classList.remove('show'); void gain.offsetWidth; gain.classList.add('show');
        setTimeout(function () { animateXP(xpBefore, xp, 1500, function () { refreshChest(xp); }); }, 350);
      }
    }, 700);
  }

  btnPlay.addEventListener('click', function () { reset(); state = 'play'; ui.classList.add('hidden'); });
  btnMenu.addEventListener('click', function () { reset(); state = 'menu'; showMenu('menu', xp); });
  btnOpen.addEventListener('click', function () {
    if (xp < XP_NEED || chest.classList.contains('shake')) return;
    openedFrom = xp; xp -= XP_NEED; saveXP();
    var name = Math.random() < 0.5 ? 'Минет' : 'Отлиз';   // 50 / 50
    btnOpen.disabled = true;
    chest.classList.remove('ready'); chest.classList.add('shake'); haptic('heavy');
    setTimeout(function () {
      chest.classList.remove('shake'); chest.classList.add('open'); haptic('medium');
      setTimeout(function () {
        if (name === 'Минет') prizes.m++; else prizes.o++;
        savePrizes(); renderCounts();
        prizeName.textContent = name; prize.classList.remove('hidden');
      }, 900);
    }, 950);
  });
  $('btnPrizeOk').addEventListener('click', function () {
    prize.classList.add('hidden');
    chest.classList.remove('open');
    animateXP(openedFrom, xp, 900, function () { refreshChest(xp); });
  });

  function color(level, shade) {
    var hue = (325 + level * 5) % 360;
    var l = shade === 0 ? 62 : shade === 1 ? 48 : 38;
    return 'hsl(' + hue + ',72%,' + l + '%)';
  }

  function reset() {
    stack = [{ x: -START / 2, z: -START / 2, w: START, d: START, level: 0 }];
    debris = []; score = 0; over = false;
    cam = { x: 0, z: 0, y: 0 };
    spawn();
  }

  function spawn() {
    var top = stack[stack.length - 1];
    var level = stack.length;
    var axis = level % 2 === 1 ? 'x' : 'z';
    cur = { x: top.x, z: top.z, w: top.w, d: top.d, level: level, axis: axis, dir: 1 };
    cur[axis] = top[axis] - AMP;
  }

  function drop() {
    if (state !== 'play' || over) return;
    var top = stack[stack.length - 1], a = cur.axis;
    var size = a === 'x' ? 'w' : 'd';
    var delta = cur[a] - top[a];
    var overlap = cur[size] - Math.abs(delta);

    if (overlap <= 0) {                       // промах — блок падает целиком
      debris.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, level: cur.level, y: cur.level * BLOCK_H, vy: 0 });
      cur = null; over = true; overAt = performance.now();
      if (score > best) { best = score; saveBest(); }
      xpBefore = xp; xp += score; saveXP();     // XP = счёт
      state = 'over'; showOver();
      haptic('heavy');
      return;
    }

    if (Math.abs(delta) < SNAP) {             // идеально — без потерь
      cur[a] = top[a];
      haptic('light');
    } else {                                  // отламываем кусок с той стороны, куда промахнулись
      var cut = { x: cur.x, z: cur.z, w: cur.w, d: cur.d, level: cur.level, y: cur.level * BLOCK_H, vy: 0 };
      if (delta < 0) {                        // выступает в минус
        cut[size] = -delta;
        cur[size] = overlap; cur[a] = top[a];
      } else {                                // выступает в плюс
        cut[a] = top[a] + top[size];
        cut[size] = delta;
        cur[size] = overlap;
      }
      debris.push(cut);
      haptic('medium');
    }
    stack.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, level: cur.level });
    score++;
    spawn();
  }

  // ---- отрисовка ----
  function P(x, z, y) {
    return [W / 2 + ((x - cam.x) - (z - cam.z)) * 0.866 * K,
            H * 0.64 + ((x - cam.x) + (z - cam.z)) * 0.5 * K - (y - cam.y) * K];
  }
  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function box(b, y, alpha) {
    var y1 = y + BLOCK_H, x2 = b.x + b.w, z2 = b.z + b.d;
    ctx.globalAlpha = alpha;
    poly([P(x2, b.z, y1), P(x2, z2, y1), P(x2, z2, y), P(x2, b.z, y)], color(b.level, 1)); // правая грань
    poly([P(b.x, z2, y1), P(x2, z2, y1), P(x2, z2, y), P(b.x, z2, y)], color(b.level, 2)); // левая грань
    poly([P(b.x, b.z, y1), P(x2, b.z, y1), P(x2, z2, y1), P(b.x, z2, y1)], color(b.level, 0)); // верх
    topPhoto(b, y1);
    // надпись на правой грани (вдоль z) и левой грани (вдоль x)
    var o1 = P(x2, z2, y1), o2 = P(b.x, z2, y1);
    faceText(o1, 0.866 * K, -0.5 * K, b.d);
    faceText(o2, 0.866 * K, 0.5 * K, b.w);
    ctx.globalAlpha = 1;
  }

  function topPhoto(b, y1) {
    if (!PHOTO.complete || !PHOTO.naturalWidth || b.w < 4 || b.d < 4) return;
    var o = P(b.x, b.z, y1), n = 256, asp = b.w / b.d, sw = n, sh = n;
    if (asp > 1) sh = n / asp; else sw = n * asp;          // кадрируем без искажений
    ctx.save();
    ctx.transform(0.866 * K, 0.5 * K, -0.866 * K, 0.5 * K, o[0], o[1]);
    ctx.drawImage(PHOTO, (n - sw) / 2, (n - sh) / 2, sw, sh, 0, 0, b.w, b.d);
    ctx.restore();
  }
  var LABEL = 'люблю Настю';
  function faceText(o, ux, uy, len) {
    if (len < 24) return;
    ctx.save();
    ctx.transform(ux, uy, 0, K, o[0], o[1]);   // координаты грани: u — вдоль, v — вниз от верхнего края
    var fs = BLOCK_H * 0.55;
    ctx.font = '700 ' + fs + 'px -apple-system, Roboto, sans-serif';
    var tw = ctx.measureText(LABEL).width;
    var max = len * 0.9;
    if (tw > max) { fs *= max / tw; ctx.font = '700 ' + fs + 'px -apple-system, Roboto, sans-serif'; tw = max; }
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillText(LABEL, (len - tw) / 2, BLOCK_H / 2);
    ctx.restore();
  }

  function frame(t) {
    var dt = Math.min(t - (last || t), 50); last = t;

    // движение блока
    if (cur) {
      var top = stack[stack.length - 1];
      var speed = Math.min(0.35 + score * 0.008, 0.85);
      cur[cur.axis] += cur.dir * speed * dt;
      if (cur[cur.axis] > top[cur.axis] + AMP) cur.dir = -1;
      if (cur[cur.axis] < top[cur.axis] - AMP) cur.dir = 1;
    }
    // обломки
    for (var i = debris.length - 1; i >= 0; i--) {
      var d = debris[i]; d.vy += 0.0016 * dt; d.y -= d.vy * dt;
      if (d.y < cam.y - 900) debris.splice(i, 1);
    }
    // камера
    var tp = stack[stack.length - 1], f = 1 - Math.pow(0.004, dt / 1000);
    cam.x += (tp.x + tp.w / 2 - cam.x) * f;
    cam.z += (tp.z + tp.d / 2 - cam.z) * f;
    cam.y += ((stack.length - 1) * BLOCK_H - cam.y) * f;

    // фон
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a2050'); g.addColorStop(1, '#3a2466');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // башня (рисуем только видимые уровни)
    var from = Math.max(0, stack.length - 22);
    for (var s = from; s < stack.length; s++) box(stack[s], s * BLOCK_H, 1);
    for (var j = 0; j < debris.length; j++) box(debris[j], debris[j].y, 0.9);
    if (cur) box(cur, cur.level * BLOCK_H, 1);

    // интерфейс
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + Math.round(H * 0.11) + 'px -apple-system, "SF Pro Display", Roboto, sans-serif';
    if (state === 'play') ctx.fillText(score, W / 2, H * 0.17);
    ctx.font = '400 ' + Math.round(Math.min(W, H) * 0.04) + 'px -apple-system, Roboto, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    if (state === 'play') ctx.fillText('Тап, чтобы поставить  ·  Рекорд ' + best, W / 2, H - 28);

    requestAnimationFrame(frame);
  }

  window.addEventListener('pointerdown', function (e) { e.preventDefault(); drop(); });
  window.addEventListener('keydown', function (e) { if (e.code === 'Space') { e.preventDefault(); drop(); } });

  reset();
  showMenu('menu', xp);
  requestAnimationFrame(frame);
})();
